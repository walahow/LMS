<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Beranda — Diagnostik</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,600;10..48,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #FBF8F3; }
a { color: #5B2BD9; } a:hover { color: #3E1BA8; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F3; display: flex; flex-direction: column;">

  <div style="flex-shrink: 0; position: relative; overflow: hidden; background: linear-gradient(135deg, #5B2BD9 0%, #9B2BC9 55%, #D12E63 100%); border-radius: 0 0 28px 28px; box-sizing: border-box; padding: 52px 22px 26px;">
    <div style="position: absolute; top: -70px; right: -50px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.13);"></div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
          <p style="margin: 0; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.80);">Selamat pagi,</p>
          <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; color: #FFFFFF;">Rani Putri</h1>
        </div>
        <div style="width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #FFFFFF;">RP</div>
      </div>

      <div style="display: flex; gap: 10px;">
        <div style="flex-grow: 1; box-sizing: border-box; padding: 13px 14px; background: rgba(255,255,255,0.16); border-radius: 15px;">
          <p style="margin: 0 0 3px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; color: #FFFFFF;">7</p>
          <p style="margin: 0; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,0.85);">Set selesai</p>
        </div>
        <div style="flex-grow: 1; box-sizing: border-box; padding: 13px 14px; background: rgba(255,255,255,0.16); border-radius: 15px;">
          <p style="margin: 0 0 3px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; color: #FFFFFF;">68%</p>
          <p style="margin: 0; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,0.85);">Paham konsep</p>
        </div>
        <div style="flex-grow: 1; box-sizing: border-box; padding: 13px 14px; background: rgba(255,255,255,0.16); border-radius: 15px;">
          <p style="margin: 0 0 3px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; color: #FFFFFF;">2</p>
          <p style="margin: 0; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,0.85);">Belum dikerjakan</p>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; box-sizing: border-box; padding: 22px 22px 0; display: flex; flex-direction: column; gap: 13px;">

    <div style="display: flex; align-items: baseline; gap: 8px;">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 19px; font-weight: 600; color: #171523;">Set soal</h2>
      <span style="flex-grow: 1;"></span>
      <a href="#semua" style="font-size: 13px; font-weight: 600; text-decoration: none;">Lihat semua</a>
    </div>

    <sc-for list="{{sets}}" as="s" hint-placeholder-count="3">
      <div style="box-sizing: border-box; background: #FFFFFF; border-radius: 20px; padding: 16px 16px 16px 20px; border: 1px solid #EFE9E0; display: flex; gap: 14px; align-items: center; position: relative; overflow: hidden;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: {{s.grad}};"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
          <span style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{s.ink}}; background: {{s.tint}}; padding: 4px 9px; border-radius: 999px;">{{s.subject}}</span>
          <h3 style="margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.35; color: #171523;">{{s.title}}</h3>
          <p style="margin: 0; font-size: 12.5px; color: #6B6478;">{{s.meta}}</p>
        </div>
        <a href="Quiz.dc.html" style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 50%; background: {{s.grad}}; display: flex; align-items: center; justify-content: center; text-decoration: none;" aria-label="Mulai set soal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
      </div>
    </sc-for>

  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; height: 78px; padding: 0 30px; background: #FFFFFF; border-top: 1px solid #EFE9E0; display: flex; align-items: center; justify-content: space-between;">
    <a href="#beranda" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; min-height: 48px; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B2BD9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span style="font-size: 11px; font-weight: 700; color: #5B2BD9;">Beranda</span>
    </a>
    <a href="#riwayat" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; min-height: 48px; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B8497" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      <span style="font-size: 11px; font-weight: 500; color: #8B8497;">Riwayat</span>
    </a>
    <a href="#profil" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 56px; min-height: 48px; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B8497" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span style="font-size: 11px; font-weight: 500; color: #8B8497;">Profil</span>
    </a>
  </div>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

    return {
      sets: [
        {

          grad: 'linear-gradient(135deg, #5B2BD9, #D12E63)',

        }
      ]
    };
  }
}
</script>
